name: Build MiniGrok

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libctrpf + 3gxtool
        run: |
          set +e
          PACMAN_CONF=/opt/devkitpro/pacman/etc/pacman.conf

          # ThePixellizerOSS first (libctrpf lives here)
          if ! grep -Fxq "[thepixellizeross-lib]" "$PACMAN_CONF" 2>/dev/null; then
            printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' | sudo tee -a "$PACMAN_CONF"
          fi
          if ! grep -Fxq "[thepixellizeross-linux]" "$PACMAN_CONF" 2>/dev/null; then
            printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' | sudo tee -a "$PACMAN_CONF"
          fi

          # Official sync often 403 on GHA – never fail the job for that
          sudo dkp-pacman -Sy --noconfirm 2>/dev/null || echo "dkp-libs sync failed (ignored)"

          # Install only from available DBs
          sudo dkp-pacman -S --noconfirm --needed libctrpf
          RC1=$?
          sudo dkp-pacman -S --noconfirm --needed 3gxtool
          RC2=$?

          echo "libctrpf install exit: $RC1"
          echo "3gxtool install exit: $RC2"

          echo "=== search CTRPluginFramework.hpp ==="
          find /opt/devkitpro -name 'CTRPluginFramework.hpp' 2>/dev/null
          ls -la /opt/devkitpro/libctrpf/include 2>/dev/null || true
          ls -la /opt/devkitpro/libctrpf/lib 2>/dev/null || true

          if [ ! -f /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp ]; then
            echo "ERROR: libctrpf headers missing after install"
            # Last resort: try direct package URL patterns
            mkdir -p /tmp/ctrpf && cd /tmp/ctrpf
            for url in \
              "https://thepixellizeross.gitlab.io/packages/any/libctrpf-0.7.4-1-any.pkg.tar.xz" \
              "https://thepixellizeross.gitlab.io/packages/any/libctrpf-0.8.0-1-any.pkg.tar.xz" \
              "https://thepixellizeross.gitlab.io/packages/any/libctrpf-latest-any.pkg.tar.xz"
            do
              echo "try $url"
              curl -fsSL -o pkg.tar.xz "$url" && break
            done
            if [ -f pkg.tar.xz ]; then
              tar -xf pkg.tar.xz
              sudo mkdir -p /opt/devkitpro/libctrpf
              sudo cp -a opt/devkitpro/libctrpf/* /opt/devkitpro/libctrpf/ 2>/dev/null || \
              sudo cp -a usr/* /opt/devkitpro/libctrpf/ 2>/dev/null || true
              find /tmp/ctrpf -type d -name include 2>/dev/null
              find /tmp/ctrpf -name 'CTRPluginFramework.hpp' 2>/dev/null
            fi
          fi

          if [ ! -f /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp ]; then
            echo "FATAL: still no CTRPluginFramework.hpp"
            exit 1
          fi
          echo "libctrpf OK"

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          make -j1 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v MiniGrok.3gx MiniGrok.elf build.log 2>/dev/null || true
          cp -v *.3gx *.elf build.log artifacts/ 2>/dev/null || true
          ls -la build/ >> artifacts/listing.txt 2>/dev/null || true
          ls -la >> artifacts/listing.txt
          find . \( -name '*.o' -o -name '*.elf' -o -name '*.3gx' \) | head -50 > artifacts/build_files.txt || true
          ls -la artifacts/ || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniGrok-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
