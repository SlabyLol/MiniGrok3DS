name: Build MiniGrok

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout MiniGrok
        uses: actions/checkout@v4

      - name: Ensure base 3DS toolchain (best effort)
        run: |
          set +e
          sudo dkp-pacman -Sy --noconfirm 2>/dev/null || true
          sudo dkp-pacman -S --noconfirm --needed 3ds-dev 2>/dev/null || true
          which arm-none-eabi-g++
          arm-none-eabi-g++ --version | head -1
          ls /opt/devkitpro/libctru/include/3ds.h

      - name: Build and install libctrpf from source
        run: |
          set -e
          cd /tmp
          rm -rf CTRPluginFramework

          git clone --depth 1 https://github.com/Tekito-256/CTRPluginFramework.git CTRPluginFramework \
            || git clone --depth 1 https://gitlab.com/thepixellizeross/ctrpluginframework.git CTRPluginFramework

          cd CTRPluginFramework
          if [ -d Library ]; then cd Library; fi

          # Newer GCC treats overloaded-virtual as error; CTRPF is not fixed yet
          if [ -f Makefile ]; then
            sed -i 's/-Werror//g' Makefile || true
            # Append override flags
            printf '\nCXXFLAGS += -Wno-error=overloaded-virtual -Wno-error\nCFLAGS += -Wno-error\n' >> Makefile
          fi

          echo "Building libctrpf..."
          make -j$(nproc) CXXFLAGS="$(grep '^CXXFLAGS' Makefile | head -1 | cut -d= -f2-) -Wno-error=overloaded-virtual -Wno-error" \
            || make -j1 \
            || make -j1 CXXFLAGS="-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -Os -fomit-frame-pointer -ffunction-sections -fno-strict-aliasing -fno-rtti -fno-exceptions -std=gnu++11 -Wno-error=overloaded-virtual -Wno-error"

          sudo mkdir -p /opt/devkitpro/libctrpf/include /opt/devkitpro/libctrpf/lib

          if [ -d include ]; then
            sudo cp -a include/. /opt/devkitpro/libctrpf/include/
          elif [ -d ../Include ]; then
            sudo cp -a ../Include/. /opt/devkitpro/libctrpf/include/
          elif [ -d Include ]; then
            sudo cp -a Include/. /opt/devkitpro/libctrpf/include/
          fi

          # Find built static libs
          find . -name 'libctrpf*.a' -o -name '*ctrpf*.a' 2>/dev/null | head -20
          if [ -f lib/libctrpf.a ]; then
            sudo cp -v lib/libctrpf.a /opt/devkitpro/libctrpf/lib/
          else
            CAND=$(find . -name 'libctrpf.a' | head -1)
            if [ -n "$CAND" ]; then sudo cp -v "$CAND" /opt/devkitpro/libctrpf/lib/libctrpf.a; fi
          fi

          make dist-bin 2>/dev/null || true
          for t in *.tar.gz *.tar.xz *.tgz; do
            [ -f "$t" ] || continue
            mkdir -p /tmp/ctrpf-dist && tar -xf "$t" -C /tmp/ctrpf-dist
            sudo cp -a /tmp/ctrpf-dist/*/include/. /opt/devkitpro/libctrpf/include/ 2>/dev/null || true
            sudo cp -a /tmp/ctrpf-dist/*/lib/. /opt/devkitpro/libctrpf/lib/ 2>/dev/null || true
          done

          echo "=== installed layout ==="
          find /opt/devkitpro/libctrpf -type f | head -40

          if [ ! -f /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp ] && \
             [ -f /opt/devkitpro/libctrpf/include/CTRPluginFramework/CTRPluginFramework.hpp ]; then
            echo '#include "CTRPluginFramework/CTRPluginFramework.hpp"' | sudo tee /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp
          fi

          # Also copy root CTRPluginFramework.hpp if present in include tree
          if [ ! -f /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp ]; then
            H=$(find /opt/devkitpro/libctrpf -name 'CTRPluginFramework.hpp' | head -1)
            if [ -n "$H" ]; then
              sudo cp -v "$H" /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp
            fi
          fi

          if [ ! -f /opt/devkitpro/libctrpf/lib/libctrpf.a ]; then
            CAND=$(find /opt/devkitpro/libctrpf -name '*.a' | head -1)
            if [ -n "$CAND" ]; then sudo cp -v "$CAND" /opt/devkitpro/libctrpf/lib/libctrpf.a; fi
          fi

          test -f /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp
          test -f /opt/devkitpro/libctrpf/lib/libctrpf.a
          ls -la /opt/devkitpro/libctrpf/include/CTRPluginFramework.hpp
          ls -la /opt/devkitpro/libctrpf/lib/libctrpf.a

      - name: Install 3gxtool (best effort)
        run: |
          set +e
          PACMAN_CONF=/opt/devkitpro/pacman/etc/pacman.conf
          if ! grep -Fxq "[thepixellizeross-linux]" "$PACMAN_CONF" 2>/dev/null; then
            printf '\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n' | sudo tee -a "$PACMAN_CONF"
            printf '\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n' | sudo tee -a "$PACMAN_CONF"
          fi
          sudo dkp-pacman -Sy --noconfirm 2>/dev/null || true
          sudo dkp-pacman -S --noconfirm --needed 3gxtool 2>/dev/null || true
          which 3gxtool || echo "3gxtool not in PATH yet"

      - name: Build MiniGrok
        run: |
          set -o pipefail
          make clean || true
          make -j1 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v MiniGrok.3gx MiniGrok.elf build.log 2>/dev/null || true
          cp -v *.3gx *.elf build.log artifacts/ 2>/dev/null || true
          ls -la >> artifacts/listing.txt
          find . \( -name '*.o' -o -name '*.elf' -o -name '*.3gx' \) | head -50 > artifacts/build_files.txt || true
          ls -la artifacts/ || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniGrok-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
