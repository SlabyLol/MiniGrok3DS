name: Build MiniGrok

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup package repos (tolerant of mirror 403)
        run: |
          set +e
          PACMAN_CONF=/opt/devkitpro/pacman/etc/pacman.conf

          sudo dkp-pacman -Sy --noconfirm || echo "WARNING: official dkp sync failed (403?) – continuing with image packages"

          if ! grep -Fxq "[thepixellizeross-lib]" "$PACMAN_CONF" 2>/dev/null; then
            echo -e "\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional" | sudo tee -a "$PACMAN_CONF"
          fi
          if ! grep -Fxq "[thepixellizeross-linux]" "$PACMAN_CONF" 2>/dev/null; then
            echo -e "\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional" | sudo tee -a "$PACMAN_CONF"
          fi

          sudo dkp-pacman -Sy --noconfirm || true

          sudo dkp-pacman -S --noconfirm --needed 3ds-dev 2>/dev/null || echo "3ds-dev already present or unavailable"
          sudo dkp-pacman -S --noconfirm --needed libctrpf 2>/dev/null || echo "libctrpf install failed"
          sudo dkp-pacman -S --noconfirm --needed 3gxtool 2>/dev/null || echo "3gxtool not available"

          echo "=== libctrpf ==="
          ls -la /opt/devkitpro/libctrpf/include 2>/dev/null || true
          find /opt/devkitpro -name 'CTRPluginFramework.hpp' 2>/dev/null | head -5 || true

      - name: Build
        run: |
          set -o pipefail
          make clean || true
          # Sequential build avoids link-before-objects races with the 3gx rules
          make -j1 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v MiniGrok.3gx MiniGrok.elf build.log 2>/dev/null || true
          cp -v *.3gx *.elf build.log artifacts/ 2>/dev/null || true
          ls -la build/ >> artifacts/listing.txt 2>/dev/null || true
          ls -la >> artifacts/listing.txt
          find . \( -name '*.o' -o -name '*.elf' -o -name '*.3gx' \) | head -50 > artifacts/build_files.txt || true
          ls -la artifacts/ || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniGrok-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
