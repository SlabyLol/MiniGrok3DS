name: Build MiniGrok

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add ThePixellizerOSS package repos + install tools
        run: |
          set -e
          # Official 3DS packages
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev || true

          # Add ThePixellizerOSS repos (libctrpf / 3gxtool)
          PACMAN_CONF=/opt/devkitpro/pacman/etc/pacman.conf
          if ! grep -Fxq "[thepixellizeross-lib]" "$PACMAN_CONF" 2>/dev/null; then
            echo -e "\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional" | sudo tee -a "$PACMAN_CONF"
          fi
          if ! grep -Fxq "[thepixellizeross-linux]" "$PACMAN_CONF" 2>/dev/null; then
            echo -e "\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional" | sudo tee -a "$PACMAN_CONF"
          fi

          sudo dkp-pacman -Sy --noconfirm

          # Install CTRPluginFramework + 3gxtool
          sudo dkp-pacman -S --noconfirm libctrpf || echo "libctrpf install failed – will try fallback"
          sudo dkp-pacman -S --noconfirm 3gxtool || echo "3gxtool not available via pacman"

      - name: Show environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          arm-none-eabi-g++ --version || true
          echo "--- looking for CTRPluginFramework ---"
          find /opt/devkitpro -name "CTRPluginFramework.hpp" 2>/dev/null | head -5 || true
          ls -la /opt/devkitpro/libctrpf 2>/dev/null || true
          ls -la /opt/devkitpro/libctrpf/include 2>/dev/null || true

      - name: Update Makefile paths for libctrpf
        run: |
          # Ensure Makefile can find libctrpf
          if [ -d /opt/devkitpro/libctrpf ]; then
            echo "libctrpf found – injecting into Makefile"
            # Append include/lib paths if not already present
            if ! grep -q "libctrpf" Makefile; then
              sed -i 's|LIBDIRS\t:=\t$(CTRULIB) $(PORTLIBS)|LIBDIRS\t:=\t$(CTRULIB) $(PORTLIBS) $(DEVKITPRO)/libctrpf|' Makefile || true
            fi
          else
            echo "libctrpf directory not found at expected location"
          fi

      - name: Build
        run: |
          make clean || true
          make -j$(nproc) 2>&1 | tee build.log
          # Keep exit code of make for the step status
          exit ${PIPESTATUS[0]}

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp -v *.3gx artifacts/ 2>/dev/null || true
          cp -v *.elf artifacts/ 2>/dev/null || true
          cp -v *.3dsx artifacts/ 2>/dev/null || true
          cp -v build.log artifacts/ 2>/dev/null || true
          find . -name "*.o" -o -name "*.elf" -o -name "*.3gx" | head -50 > artifacts/build_files.txt || true
          ls -la > artifacts/listing.txt
          echo "Artifact collection done"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniGrok-build
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
